# Evaluate the ranking-aware QA scorer on MuSC sz256 without retraining Phase A models.
# Reuses the existing musc_crop256 ensemble checkpoint/databank for ensemble_qa.
extends: musc_crop256.yaml

qa_ranking_loss_weight: 0.5
phaseA_ensemble_artifact_variant: musc_crop256

run_phaseA_competitors: false
run_phaseA_silver_truth: false
run_phaseA_fusion: false
run_phaseA_ensemble: false

ablation_modes:
  - qa_only
  - full_pipeline
  - ensemble_qa
