# Evaluate the ranking-aware QA scorer on HSC without retraining Phase A models.
# Reuses the existing baseline ensemble checkpoint/databank for ensemble_qa.
extends: hsc_crop64.yaml

qa_ranking_loss_weight: 0.5
phaseA_ensemble_artifact_variant: baseline

run_phaseA_competitors: false
run_phaseA_silver_truth: false
run_phaseA_fusion: false
run_phaseA_ensemble: false

ablation_modes:
  - qa_only
  - full_pipeline
  - ensemble_qa
